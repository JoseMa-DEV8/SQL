<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ratios de Aprobados por Curso</title>
    <link rel="stylesheet" href="grafico.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <img src="./fondo/medac.png">
    <h1>Ratios de Aprobados por Curso</h1>
    <canvas id="graficoRatios" width="600" height="600"></canvas>
    <div id="tabla-leyenda"></div> 
    <div id="menu-navegacion">
        <button onclick="window.location.href='index.html'">Inicio</button>
        <button onclick="window.location.href='editar_curso.html'">Editar Curso</button>
    </div>
    <script>
       async function obtenerRatios() {
    try {
        const response = await fetch('/cursos/ratios');
        if (!response.ok) throw new Error('Error al obtener los datos del servidor');

        const datos = await response.json();
        console.log('Datos obtenidos:', datos); // Verificar los datos en la consola

        const nombresCursos = datos.map(item => item.curso_nombre);
        const ratiosAprobados = datos.map(item => {
            const totalAprobados = parseInt(item.total_aprobados, 10);
            const totalMatriculados = parseInt(item.total_matriculados, 10);

            if (isNaN(totalAprobados) || isNaN(totalMatriculados)) {
                console.warn(`Datos inválidos para el curso ${item.curso_nombre}:`, item);
                return 0;
            }

            const ratio = totalMatriculados > 0 
                ? ((totalAprobados / totalMatriculados) * 100).toFixed(2)
                : 0;

            console.log(`Curso: ${item.curso_nombre}, Aprobados: ${totalAprobados}, Matriculados: ${totalMatriculados}, Ratio: ${ratio}%`);

            return ratio;
        });

        const colores = [
            '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0',
            '#9966FF', '#FF9F40', '#8B0000', '#00CED1',
            '#228B22', '#FFD700', '#8A2BE2', '#DC143C',
            '#00FA9A', '#FF7F50', '#1E90FF', '#FF1493',
            '#00BFFF', '#ADFF2F', '#FF4500', '#7FFF00'
        ];


        while (colores.length < nombresCursos.length) {
            colores.push('#' + Math.floor(Math.random() * 16777215).toString(16));
        }

        const ctx = document.getElementById('graficoRatios').getContext('2d');
        new Chart(ctx, {
            type: 'pie',
            data: {
                labels: nombresCursos,
                datasets: [{
                    label: 'Ratio de Aprobados (%)',
                    data: ratiosAprobados,
                    backgroundColor: colores,
                    borderColor: '#ffffff',
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        callbacks: {
                            label: function (tooltipItem) {
                                return `${tooltipItem.label}: ${tooltipItem.raw}%`;
                            }
                        }
                    }
                }
            }
        });

        generarTablaLeyenda(nombresCursos, ratiosAprobados, colores);
    } catch (error) {
        console.error('Error al cargar los ratios:', error);
    }
}

function generarTablaLeyenda(nombresCursos, ratiosAprobados, colores) {
    const tablaLeyenda = document.getElementById('tabla-leyenda');
    tablaLeyenda.innerHTML = `
        <table border="1" style="width: 100%; border-collapse: collapse; text-align: center;">
            <thead>
                <tr style="background-color: #f0f0f0;">
                    <th>Color</th>
                    <th>Curso</th>
                    <th>Ratio de Aprobados (%)</th>
                </tr>
            </thead>
            <tbody>
                ${nombresCursos.map((curso, index) => `
                    <tr>
                        <td style="background-color: ${colores[index]}; width: 30px;"></td>
                        <td>${curso}</td>
                        <td>${ratiosAprobados[index]}%</td>
                    </tr>
                `).join('')}
            </tbody>
        </table>
    `;
}

obtenerRatios();

    </script>
</body>
</html>
